version: '3.8'

services:
  db:
    image: mysql:8.0.36
    container_name: crm_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-crm_jot}
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialize DB automatically from our dump on first run
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-crm_jot}
      - PORT=5000
    ports:
      # Expose on 5000 as the single unified entrypoint for both frontends and API
      - "127.0.0.1:${HOST_BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
      # We no longer mount the local backend folder because we want the compiled frontends built by the Dockerfile
      # to be served statically from public/crm and public/docplatform inside the container.
      # Local development changes will require rebuilding the container, but it ensures a robust production environment.
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backend_uploads:
